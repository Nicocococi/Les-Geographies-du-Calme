<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géographies du Calme — Générateur d'itinéraires</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
  :root{--or:#b8722c;--noir:#2b2b2b;--muted:#6b6459;--sand:#f3eee5;--card:#fff;}
  *{box-sizing:border-box}
  body{font-family:-apple-system,Inter,sans-serif;background:var(--sand);color:var(--noir);margin:0;padding:24px;line-height:1.5}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
  .form{background:var(--card);border:1px solid #e7e0d4;border-radius:14px;padding:16px;max-width:880px;margin-bottom:18px}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
  label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
  input,select{padding:8px 10px;border:1px solid #d8d0c2;border-radius:8px;font-size:.95rem;background:#fff}
  .themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .themes label{display:inline-flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--noir);background:#f7f3ec;border:1px solid #e0d8c8;border-radius:20px;padding:5px 10px;cursor:pointer}
  button{background:var(--or);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:.95rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .wrap{display:flex;gap:20px;flex-wrap:wrap}
  #map{width:560px;max-width:100%;height:520px;border-radius:14px;border:1px solid #e7e0d4}
  .panel{flex:1;min-width:320px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{background:#fff;border:1px solid #e0d8c8;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.9rem}
  .tab.on{background:var(--or);color:#fff;border-color:var(--or)}
  .step{background:#fff;border:1px solid #ece5d8;border-left:4px solid var(--or);border-radius:10px;padding:10px 14px;margin-bottom:8px}
  .step .h{font-size:.78rem;color:var(--or);font-weight:700}
  .step .t{font-weight:600}
  .step .x{font-size:.88rem;color:#4a4a4a;margin-top:3px}
  .step .pin{font-size:.78rem;color:var(--muted);margin-top:4px}
  .leg{font-size:.78rem;color:#9a8f7e;margin:2px 0 2px 14px;padding:2px 0 2px 10px;border-left:2px dotted #d8cdb8}
  .leg-car{color:#b8722c;font-weight:600;border-left-color:#b8722c}
  .mk{width:26px;height:26px;border-radius:50%;background:var(--or);color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font:700 12px/1 Inter,sans-serif}
  .log{font-size:.8rem;color:var(--muted);white-space:pre-wrap;margin-top:10px}
  .err{color:#b00}
  .dbg{max-width:1200px;margin-top:16px;font-size:.8rem;color:#555;background:#fbf8f2;border:1px dashed #d8d0c2;border-radius:10px;padding:12px;line-height:1.8}
  .dbg h3{font-size:.95rem;margin:0 0 8px}
  .dbg b{color:#7a5a2a}
</style>
</head>
<body>
<h1>Générateur d'itinéraires — Géographies du Calme</h1>
<div class="sub">Un itinéraire lent, à pied, quartier par quartier — composé à partir de lieux réels.</div>

<div class="form">
  <div class="row">
    <div><label>Destination</label><input id="dest" value="Carcassonne" style="width:200px"></div>
    <div><label>Jours</label><select id="duree"><option>1</option><option selected>2</option><option>3</option></select></div>
    <div><label>Avec qui</label><select id="voyage"><option value="duo" selected>À deux</option><option value="solo">Solo</option><option value="famille">Famille</option><option value="entre amis">Entre amis</option></select></div>
    <div><label>Budget</label><select id="budget"><option value="économique">Essentiel</option><option value="confortable" selected>Confort</option><option value="premium">Premium</option></select></div>
    <div><label>Saison</label><select id="saison"><option value="" selected>Indifférent</option><option value="printemps">Printemps</option><option value="ete">Été</option><option value="automne">Automne</option><option value="hiver">Hiver</option></select></div>
  </div>
  <div style="margin-top:10px"><label>Thèmes (max 2)</label>
    <div class="themes" id="themes">
      <label><input type="checkbox" value="gastronomie">Gastronomie</label>
      <label><input type="checkbox" value="nature">Nature</label>
      <label><input type="checkbox" value="culture">Culture</label>
      <label><input type="checkbox" value="sport" checked>Sportif</label>
      <label><input type="checkbox" value="festif">Festif</label>
      <label><input type="checkbox" value="bienetre">Bien-être</label>
      <label><input type="checkbox" value="urbain">Urbain</label>
    </div>
  </div>
  <div style="margin-top:14px"><button id="go" onclick="generer()">Générer mon itinéraire</button></div>
  <div class="log" id="log"></div>
</div>

<div class="wrap" id="result" style="display:none">
  <div id="map"></div>
  <div class="panel"><div class="tabs" id="tabs"></div><div id="list"></div></div>
</div>
<div id="debug" class="dbg" style="display:none"></div>

<script>
/* ============================================================
   ====  TABLE DE MAPPING ÉDITABLE  (catégorie Geoapify -> thème)  ====
   Pour modifier un classement : change la valeur d'une ligne ci-dessous.
   Thèmes : gastronomie, festif, culture, nature, sport, bienetre
   (catégorie absente = ignorée ; "urbain" = géré par le quartier + LLM)
   ============================================================ */
window.GEO_THEME_MAP = {
  // FESTIF
  'catering.bar':'festif','catering.pub':'festif','catering.biergarten':'festif','catering.taproom':'festif','adult.nightclub':'festif','entertainment.escape_game':'festif','entertainment.amusement_arcade':'festif',
  // GASTRONOMIE (fast-food volontairement absent)
  'catering.restaurant':'gastronomie','catering.cafe':'gastronomie','catering.ice_cream':'gastronomie','catering.food_court':'gastronomie','commercial.marketplace':'gastronomie','commercial.food_and_drink':'gastronomie','production.winery':'gastronomie','production.brewery':'gastronomie','production.distillery':'gastronomie',
  // NATURE (viewpoint plus specifique que tourism.attraction)
  'tourism.attraction.viewpoint':'nature','leisure.park':'nature','leisure.picnic':'nature','natural':'nature','national_park':'nature','beach':'nature','waterway':'nature','maritime.marina':'nature','man_made.pier':'nature',
  // SPORT (pitch/shooting volontairement absents)
  'sport.fitness':'sport','sport.swimming_pool':'sport','sport.sports_centre':'sport','sport.golf_course':'sport','sport.horse_riding':'sport','sport.ice_rink':'sport','sport.dive_centre':'sport','sport.dojo':'sport','sport.skateboard':'sport','rental.bicycle':'sport','rental.boat':'sport','rental.ski':'sport','ski':'sport','entertainment.activity_park':'sport','entertainment.water_park':'sport','entertainment.bowling_alley':'festif','entertainment.miniature_golf':'festif','entertainment.theme_park':'festif','sport.fishing':'sport',
  // BIEN-ETRE
  'leisure.spa':'bienetre','service.beauty.spa':'bienetre','service.beauty.massage':'bienetre',
  // CULTURE (patrimoine : musées, sites historiques, églises, théâtres)
  'entertainment.museum':'culture','entertainment.culture':'culture','entertainment.cinema':'culture','tourism.sights':'culture','heritage':'culture',
  // URBAIN (curiosités & repères de ville : tourism.attraction = landmarks, architecture, street art via .artwork, curiosités type tête de Godzilla). Le patrimoine reste en culture ; les panoramas (.viewpoint) restent en nature.
  'tourism.attraction':'urbain'
};
/* ====  FIN DE LA TABLE ÉDITABLE  ==== */
const API='https://geocalme-api-proxy.nicolas-chevreau.workers.dev';
const OVP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const CHAINS=/mcdonald|burger king|\bkfc\b|subway|starbucks|\bquick\b|domino|pizza hut|o'?tacos|buffalo grill|flunch|\bpaul\b|brioche dor|hippopotamus|courtepaille|la mie c[aâ]line|columbus caf|five guys|\bnsubway\b|tacos avenue|h[äa]agen.?dazs|ben ?(&|and) ?jerry|\bamorino\b|\bgrom\b|fitness first|basic[- ]?fit|virgin active|gold'?s gym|anytime fitness|snap fitness|planet fitness|fitness park|keep ?cool|neoness|on air fitness|magic form|l'?orange bleue|world class|california fitness|true fitness|\bcmg sport|vita ?liberté/i;
const JUNK=/inter[- ]?administratif|restaurant inter\b|cantine|crous|caf[eé]t[eé]ria|self[- ]?service|ehpad|maison de retraite/i;
// NOMS GÉNÉRIQUES / PLACEHOLDER (un lieu nommé juste « Rooftop Pool », « Gym », « Piscine »… = fiche sans identité réelle -> on écarte)
const VAGUE=/^(rooftop ?pool|pool|swimming ?pool|the ?pool|piscine|gym|fitness|le ?gym|sports? ?cent(re|er)|salle de sport|stadium|stade|terrain de sport|sports? ?ground|playground|aire de jeux|club ?house|spa|hammam|sauna|massage|bar|pub|caf[ée]|restaurant|h[ôo]tel|hotel|parking|rooftop)$/i;
const NOTSPORT=/^(la\s+)?gare\b|gare\s+(sncf|routi)|\basptt\b|^place\s|^esplanade\s|^parking\b/i;
const BIKE=/v[eé]lo|cyclo|bicycle/i;
const MUNI=/gymnase|complexe sportif|centre sportif|cit[eé] des sports|stade\b|sports?[- ]?(centre|hall)|salle (de )?sports?|halle (des|aux) sports|boulodrome|palais des sports|maison des sports/i;
const EXPERIENCE=/canoe|kayak|rafting|paddle|nautique|escalade|via.?ferrata|accro|spelolog|grotte|equitation|cheval|v[eé]lo|vtt|\brando|buggy|\bquad\b|parapente|base.?de.?loisirs|t[eé]l[eé]ski|wakeboard|plong[eé]e|grimpe|aventure|tyrolienne|golf/i;
const FACILITY=/gymnase|complexe sportif|cit[eé] des sports|salle de sports?|salle des sports|\bstade\b|tennis club|club de tennis|boulodrome|halle des sports|\bdojo\b/i;
const SHARE=/^(lime|pony|dott|tier|bird|bolt|voi|jump|v[eé]lib|donkey|zoov|knot)\b/i;
// FAMILLE — catégories enfants réintégrées au vivier UNIQUEMENT pour voyage==='famille' (par catégorie structurée OSM/Geoapify, jamais par nom propre)
const KIDCAT=/entertainment\.(zoo|aquarium)|\bzoo\b|\baquarium\b|wildlife|animal_?park|parc animalier|m[ée]nagerie|petting|leisure\.playground|\bplayground\b|aire de jeux/i;
// AMIS — activités de GROUPE (bowling, escape game, arcade, mini-golf, laser, karaoké…) : remontées en étape quand voyage==='entre amis' (par catégorie/signal, jamais par nom propre)
const GROUPCAT=/entertainment\.(bowling_alley|escape_game|amusement_arcade|miniature_golf)|bowling|escape.?game|jeu d'?[ée]vasion|laser.?game|karaok|\bbillard\b|billiard|paintball|mini.?golf|\barcade\b|fl[ée]chette/i;
// FESTIF — séparation JOUR / SOIR par CATÉGORIE structurée (OSM/Geoapify + libellés FSQ), jamais par le nom (universel).
// NIGHTLIFE = sortie du SOIR uniquement (bars/pubs/clubs/salles de spectacle). DAYFESTIF = loisir de GROUPE de journée (bowling/escape/arcade/mini-golf/parc à thème).
const NIGHTLIFE_CAT=/catering\.(bar|pub|biergarten|taproom)|adult\.nightclub|music_venue|\bnightclub\b|\bbar\b|\bpub\b|discoth[èe]que|cabaret|music.?hall|salle de concert|salle de spectacle|salle de concert jazz/i;
const DAYFESTIF_CAT=/entertainment\.(bowling_alley|escape_game|amusement_arcade|miniature_golf|theme_park|activity_park)|\bbowling\b|escape.?game|jeu d'?[ée]vasion|\barcade\b|salle d'?arcade|\bbillard\b|billiard|salle de billard|mini.?golf|laser.?game|parc d'?attractions?/i;
function isDayFestif(c){ if(!c||c.theme!=='festif')return false; var s=((c.catsrc||'')+' '+((c._c&&c._c.catsrc)||'')+' '+(c.cat||'')).toLowerCase(); return DAYFESTIF_CAT.test(s); }
// GARDE-FOU SÉCURITÉ FAMILLE (centralisé) : un lieu « enfant » (zoo/aquarium/aire de jeux — nom OU catégorie) ne doit entrer dans AUCUN pool de journée (étape, icône, « en chemin ») chez un profil non-famille. À appliquer à CHAQUE point d'entrée d'un POI (pool de thème, AMBIANCE, _dayLM, landmarks//near). Exception assumée au « jamais par le nom » : exclusion de sécurité, pas un classement.
function kidExcluded(name,cat,voyage){ return voyage!=='famille' && KIDCAT.test(((name||'')+' '+(cat||'')).toLowerCase()); }
const EXTRA_CATS='entertainment.bowling_alley,entertainment.miniature_golf,entertainment.theme_park,sport.fishing,entertainment.escape_game,entertainment.amusement_arcade';
const WATER_CATS='waterway,maritime.marina,man_made.pier';
const QUERY_EXCLUDE=['sport.fishing']; // réactivées (demandé) : bowling, mini-golf, parc à thème, escape game, arcade, voie d'eau, marina, jetée. SEULE la pêche reste exclue.
let TOKEN=null, MAP=null, MARKERS=[], DAYS=[], ACTIVE=1, LANDMARKS=[], AMBIANCE=[];
const PERIPHERY_KM=15; // périphérie proche (injection d'un thème manquant)
const REGION_KM=35; // rayon régional pour les journées-excursion (canoë, accro, base de loisirs…)
const CARHOP_KM=20; // JOKER : rayon max d'un saut voiture EN JOURNÉE quand la bulle marchable est trop pauvre
const CORE_KM=6; // CŒUR URBAIN : on n'ancre une journée en BANLIEUE/excursion (> CORE_KM du centre) que si le cœur est ÉPUISÉ pour le thème. Grande ville -> jamais la banlieue ; petite ville -> excursion permise quand l'intra-muros est à court.
const DAY_MIN_ACT=3; // en-dessous de ce nb d'activités marchables, on autorise le joker voiture
const THEME_LABEL={gastronomie:'Gastronomie',nature:'Nature',culture:'Culture',sport:'Bouger & Explorer',festif:'Vie locale & festif',bienetre:'Bien-être',urbain:'Urbain'};

const _norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// Similarité « même lieu / même activité » : on réduit le nom à ses mots distinctifs (sans la ville ni les mots génériques)
const _STOP=new Set(['de','du','des','la','le','les','aux','au','et','en','sur','sous','un','une','club','centre','complexe','salle','stade','base','espace','parc','park','sport','sports','loisir','loisirs','municipal','municipale','ecole','association','de']);
function coreTokens(nom,ville){const vil=_norm(ville||'').split(/[^a-z0-9]+/).filter(Boolean);
  return new Set(_norm(nom).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!_STOP.has(w)&&vil.indexOf(w)<0));}
function sameKind(a,b,ville){const A=coreTokens(a,ville),B=coreTokens(b,ville);if(!A.size||!B.size)return false;const S=A.size<=B.size?A:B,L=A.size<=B.size?B:A;let inter=0;S.forEach(w=>{if(L.has(w))inter++;});return inter===S.size;} // le plus petit ensemble entièrement inclus dans l'autre
function sharesBrand(a,b,ville){const A=coreTokens(a,ville),B=coreTokens(b,ville);if(A.size<2||B.size<2)return false;let inter=0;A.forEach(w=>{if(B.has(w))inter++;});return inter>=2;} // >=2 mots propres communs = meme marque/cluster (ex. « Jim Thompson House » & « Jim Thompson Art Centre »)
const SEASON_COLD=/\bski\b|ski de fond|raquette|snowboard|snowpark|\bluge\b|motoneige|traineau|biathlon|telesiege|teleski|station de ski|chiens? de traineau/;
const SEASON_WARM=/\bgolf\b|plage|baignade|nautique|kayak|canoe|paddle|rafting|\bsurf\b|wakeboard|\bvoile\b|plongee|parc aquatique|water ?park|canyoning|via ?ferrata|accro|parc aventure|tyrolienne|parapente/;
function seasonOf(name,cats){const s=_norm((name||'')+' '+((cats||[]).join(' ')));if(SEASON_COLD.test(s))return 'cold';if(SEASON_WARM.test(s))return 'warm';return null;}
function hav(la1,lo1,la2,lo2){const R=6371,t=Math.PI/180;const dLa=(la2-la1)*t,dLo=(lo2-lo1)*t;const a=Math.sin(dLa/2)**2+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin(dLo/2)**2;return R*2*Math.asin(Math.sqrt(a));}
function log(m,err){const el=document.getElementById('log');el.innerHTML+=(err?'<span class="err">':'<span>')+m+'</span>\n';}

function fetchT(url,opts,ms){const ctl=new AbortController();const id=setTimeout(()=>ctl.abort(),ms||13000);return fetch(url,Object.assign({},opts||{},{signal:ctl.signal})).finally(()=>clearTimeout(id));}
async function getToken(){if(TOKEN)return TOKEN;const d=await(await fetch(API+'/mapbox-token')).json();TOKEN=d.token;return TOKEN;}
async function llm(prompt,maxTok){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTok||1800,messages:[{role:'user',content:prompt}]})});const d=await r.json();return (d.content&&d.content[0]&&d.content[0].text)||'';}

async function geocode(q,prox,cc,types){let u='https://api.mapbox.com/geocoding/v5/mapbox.places/'+encodeURIComponent(q)+'.json?access_token='+TOKEN+'&limit=1&language=fr&autocomplete=false';if(types)u+='&types='+encodeURIComponent(types);if(prox)u+='&proximity='+prox[0]+','+prox[1];if(cc)u+='&country='+cc;try{const d=await(await fetch(u)).json();const f=d.features&&d.features[0];if(!f)return null;let c='',city='';if(f.context){const e=f.context.find(x=>x.id&&x.id.indexOf('country')===0);if(e&&e.short_code)c=e.short_code.split('-')[0];const pl=f.context.find(x=>x.id&&x.id.indexOf('place')===0);if(pl&&pl.text)city=pl.text;}const _pt=(f.place_type&&f.place_type[0])||'';if(!city&&(_pt==='place'||_pt==='locality'))city=f.text||'';return{lat:f.center[1],lng:f.center[0],cc:c,nom:f.text||'',city:city};}catch(e){return null;}}

async function wikivoyage(ville){try{const u='https://fr.wikivoyage.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&format=json&origin=*&titles='+encodeURIComponent(ville);const d=await(await fetchT(u,{},8000)).json();const p=d.query.pages;return _norm(p[Object.keys(p)[0]].extract||'');}catch(e){return '';}}

async function overpassRun(q){
  for(const m of OVP){const host=m.split('/')[2];try{log('  · Overpass '+host+'…');const res=await fetchT(m,{method:'POST',body:'data='+encodeURIComponent(q)},13000);const tx=await res.text();if(tx.trim()[0]==='{')return JSON.parse(tx).elements||[];log('  · '+host+' : réponse non-JSON, miroir suivant');}catch(e){log('  · '+host+' : timeout/échec, miroir suivant');}}
  log('  · Aucun miroir Overpass disponible (réessaie — d\'où Geoapify en prod).',true);return [];}
async function overpass(lat,lon,r){r=r||1000;const q='[out:json][timeout:12];('+
  'nwr(around:'+r+','+lat+','+lon+')[amenity~"^(cafe|restaurant|marketplace|ice_cream)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[shop~"^(bakery|pastry|deli|cheese|greengrocer|wine)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[amenity~"^(bar|pub|nightclub|biergarten|music_venue)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[tourism~"^(museum|gallery|attraction|artwork)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[historic][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[amenity~"^(theatre|cinema|arts_centre)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[tourism=viewpoint][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[leisure~"^(park|garden|nature_reserve)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[natural~"^(water|peak|wood|beach)$"][name];'+
  'nwr(around:'+(r+800)+','+lat+','+lon+')[amenity~"^(bicycle_rental|boat_rental|canoe_rental)$"];'+
  'nwr(around:'+r+','+lat+','+lon+')[leisure~"^(sports_centre|fitness_centre|swimming_pool|water_park|horse_riding|climbing)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[leisure~"^(spa|sauna)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[amenity~"^(spa|public_bath)$"][name];'+
  ');out tags center 160;';
  return overpassRun(q);}
async function overpassNatureSport(lat,lon,r){const q='[out:json][timeout:18];('+
  'nwr(around:'+r+','+lat+','+lon+')[leisure~"^(park|garden|nature_reserve)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[natural~"^(water|peak|wood|beach)$"][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[tourism=viewpoint][name];'+
  'nwr(around:'+r+','+lat+','+lon+')[amenity~"^(bicycle_rental|boat_rental|canoe_rental)$"];'+
  'nwr(around:'+r+','+lat+','+lon+')[leisure~"^(sports_centre|fitness_centre|swimming_pool|water_park|horse_riding|climbing)$"][name];'+
  ');out tags center 150;';
  return overpassRun(q);}

function catToTheme(c){var best=null,bl=-1;for(var k in GEO_THEME_MAP){if((c===k||c.indexOf(k+".")===0)&&k.length>bl){bl=k.length;best=GEO_THEME_MAP[k];}}return best;}
function geoapifyTheme(cats){
  if(typeof GEO_THEME_MAP==='undefined')return null;
  var ts=(cats||[]).map(catToTheme).filter(Boolean);
  var prio=['festif','sport','bienetre','gastronomie','nature','culture'];
  for(var i=0;i<prio.length;i++)if(ts.indexOf(prio[i])>=0)return prio[i];

/* ===== CLUSTERING : on regroupe les lieux en grappes marchables ===== */
function clusterList(items,radiusKm){
  items=items.slice().sort((a,b)=>b.score-a.score);
  const taken=new Array(items.length).fill(false);const clusters=[];
  for(let i=0;i<items.length;i++){if(taken[i])continue;const seed=items[i];const members=[seed];taken[i]=true;
    for(let j=0;j<items.length;j++){if(taken[j])continue;if(hav(seed.lat,seed.lng,items[j].lat,items[j].lng)<=radiusKm){members.push(items[j]);taken[j]=true;}}
    const lat=members.reduce((s,m)=>s+m.lat,0)/members.length, lng=members.reduce((s,m)=>s+m.lng,0)/members.length;
    clusters.push({lat,lng,members});}
  return clusters;
}
function clusterCore(list,radiusKm){return clusterList(list.filter(c=>!c.periph),radiusKm);}
// grappes RÉGIONALES (périphérie) pour d'éventuelles journées-excursion
function rankRegion(clusters,themes){
  return clusters.map(cl=>{const top=cl.members.slice().sort((a,b)=>b.score-a.score)[0];
    const notableAnchor=cl.members.some(m=>m.notable);
    const themed=cl.members.filter(m=>themes.includes(m.theme)).length;
    return Object.assign(cl,{anchorDist:top?top.distKm:99,notableAnchor,size:cl.members.length,themed});
  }).sort((a,b)=>(b.notableAnchor-a.notableAnchor)||(b.themed-a.themed)||(b.size-a.size)||(a.anchorDist-b.anchorDist));
}
function pickRegion(rc,n,avoid){
  const chosen=[];
  for(const cl of rc){if(chosen.length>=n)break;
    if(chosen.every(o=>hav(o.lat,o.lng,cl.lat,cl.lng)>2)&&avoid.every(o=>hav(o.lat,o.lng,cl.lat,cl.lng)>2))chosen.push(cl);}
  return chosen.slice(0,n);
}
// pool d'une JOURNÉE-EXCURSION : ancrage régional + alentours + repas régional si dispo
function buildExcursionCands(cluster,regionPool,used){
  const cands={};
  const add=(c)=>{if(!c||used.has(_norm(c.nom)))return;if((cands[c.theme]||[]).some(o=>_norm(o.nom)===_norm(c.nom)))return;(cands[c.theme]=cands[c.theme]||[]).push(c);};
  cluster.members.forEach(add);
  if(!(cands.gastronomie&&cands.gastronomie.length)){
    regionPool.filter(c=>c.theme==='gastronomie'&&!used.has(_norm(c.nom))).map(c=>Object.assign({},c,{d:hav(cluster.lat,cluster.lng,c.lat,c.lng)})).filter(c=>c.d<3).sort((a,b)=>a.d-b.d).slice(0,2).forEach(add);
  }
  Object.keys(cands).forEach(k=>cands[k]=cands[k].sort((a,b)=>(hav(cluster.lat,cluster.lng,a.lat,a.lng)-hav(cluster.lat,cluster.lng,b.lat,b.lng))||(b.score-a.score)));
  return cands;
}
// note une grappe selon la COUVERTURE des thèmes choisis (prioritaire), puis la richesse
function rankClusters(clusters,themes){
  return clusters.map(cl=>{
    const present=new Set(cl.members.filter(m=>themes.includes(m.theme)).map(m=>m.theme));
    const chosenCount=cl.members.filter(m=>themes.includes(m.theme)).length;
    return Object.assign(cl,{coverage:present.size,chosenCount,size:cl.members.length});
  }).sort((a,b)=>b.coverage-a.coverage||b.chosenCount-a.chosenCount||b.size-a.size);
}
// choisit n grappes DISTINCTES (centres éloignés), repli sans doublon pour petites villes
function pickDays(ranked,n){
  const chosen=[];
  for(const cl of ranked){if(chosen.length>=n)break;if(chosen.every(o=>hav(o.lat,o.lng,cl.lat,cl.lng)>0.7))chosen.push(cl);}
  for(const cl of ranked){if(chosen.length>=n)break;if(chosen.indexOf(cl)<0)chosen.push(cl);}
  return chosen.slice(0,n);
}
// pool d'un jour : membres de la grappe + repas garanti + MIN 1 activité par thème choisi (sinon 1 excursion périphérie)
function buildDayCands(cluster,allCore,periph,themes,used,usedKinds){
  const cands={};
  const blockBike=usedKinds&&usedKinds.has('velo')&&cluster.members.some(m=>m.theme==='sport'&&!BIKE.test(m.nom)&&(m.notable||m.score>=1));
  const add=(c)=>{if(!c||used.has(_norm(c.nom)))return;if(blockBike&&BIKE.test(c.nom))return;if((cands[c.theme]||[]).some(o=>_norm(o.nom)===_norm(c.nom)))return;(cands[c.theme]=cands[c.theme]||[]).push(c);};
  cluster.members.forEach(add);
  // repas : garantir de la gastronomie proche, même si non choisie comme thème
  if(!(cands.gastronomie&&cands.gastronomie.length)){
    allCore.filter(c=>c.theme==='gastronomie'&&!used.has(_norm(c.nom))).map(c=>Object.assign({},c,{d:hav(cluster.lat,cluster.lng,c.lat,c.lng)})).filter(c=>c.d<1.6).sort((a,b)=>a.d-b.d).slice(0,4).forEach(add);
  }
  // BIEN-ÊTRE composite : emprunter des lieux nature paisibles (jardin, eau, forêt, point de vue) comme ressourcement
  if(themes.includes('bienetre')&&!themes.includes('nature')){
    (cands.nature||[]).slice(0,4).forEach(c=>add(Object.assign({},c,{theme:'bienetre',wellness:true})));
  }
  // MIN 1 activité par thème CHOISI
  themes.forEach(th=>{
    if(cands[th]&&cands[th].length)return;
    const near=allCore.filter(c=>c.theme===th&&!used.has(_norm(c.nom))).map(c=>Object.assign({},c,{d:hav(cluster.lat,cluster.lng,c.lat,c.lng)})).filter(c=>c.d<1.8).sort((a,b)=>a.d-b.d)[0];
    if(near){add(near);return;}
    const exc=(periph[th]||[]).filter(c=>!used.has(_norm(c.nom)))[0]; // sinon UNE excursion voiture assumée
    if(exc)add(exc);
  });
  // tri : non-périphérie d'abord, puis centralité à la grappe, puis score
  Object.keys(cands).forEach(k=>cands[k]=cands[k].sort((a,b)=>(a.periph-b.periph)||(hav(cluster.lat,cluster.lng,a.lat,a.lng)-hav(cluster.lat,cluster.lng,b.lat,b.lng))||(b.score-a.score)));
  return cands;
}
// étiquette de la grappe : quartier réel (reverse geocode) sinon "Autour de <lieu phare>"
async function clusterLabel(cluster){

// CURATEUR sémantique : dernier filet, rejette tout lieu non présentable (généralise sans liste noire)
async function curateCands(cands,themesLab){
  const flat=[]; let i=1;
  Object.keys(cands).forEach(th=>(cands[th]||[]).forEach(c=>flat.push({id:'k'+(i++),th,c})));
  if(flat.length<3) return cands;
  const lst=flat.map(p=>p.id+'. '+p.c.nom+' ('+p.th+')').join('\n');
  const prompt='Filtre une liste de lieux pour un itinéraire de voyage. Thèmes du voyageur : '+(themesLab||'variés')+'.\n'+
   'OBJECTIF : GARDER tout lieu où l\'on peut réellement FAIRE une activité liée à ces thèmes, MÊME un lieu ordinaire et non secret (ex. si Sport : piscine, tennis, salle d\'escalade, club, base de loisirs, parcours, salle de sport ; si Bien-être : spa, thermes). Le but est que le voyageur ait TOUJOURS de quoi faire.\n'+
   'ÉCARTE UNIQUEMENT le manifestement parasite : fast-food et chaînes, supermarchés et commerces banals, MAGASINS et BOUTIQUES (magasins de sport, de skis, « X Sports », stores, enseignes), LOUEURS de matériel (location de skis/vélos) — ce ne sont PAS des lieux d\'activité —, stations de trottinettes/vélos en libre-service, parkings, administrations, écoles, hôtels, et tout nom qui ressemble à un artefact de données (sigle obscur, nom tronqué, opérateurs accolés par un point-virgule). '+
   'Garde les restaurants pour les repas. En cas de doute sur la pertinence, GARDE — n\'écarte que le clairement parasite.\n\n'+
   lst+'\n\nRéponds UNIQUEMENT en JSON: ["k1","k3", ...] = la liste des id à CONSERVER.';
  let keep=null;
  try{keep=parseJSON(await llm(prompt,700));}catch(e){}
  if(!Array.isArray(keep)) return cands; // échec curateur -> on garde
  const ks=new Set(keep);
  const out={};
  flat.forEach(p=>{if(ks.has(p.id))(out[p.th]=out[p.th]||[]).push(p.c);});
  return Object.keys(out).length?out:cands;
}
// ===== ZONAGE : construit la journée autour d'un ancrage (bulle marchable + saut voiture limité) =====
function buildDayAround(center,all,themes,used,usedKinds){
  // RAYON MARCHABLE ADAPTATIF À LA DENSITÉ : on prend le rayon qui capte ~10 lieux autour de l'ancre, borné 1,5–3 km.
  // Ville dense (Paris/Bangkok) -> ~1,5 km (étapes serrées) ; zone clairsemée (Carcassonne/Annecy) -> jusqu'à 3 km.
  const _ds=all.filter(c=>themes.includes(c.theme)||c.theme==='gastronomie').map(c=>hav(center.lat,center.lng,c.lat,c.lng)).sort((a,b)=>a-b);
  const WALK=Math.max(1.1,Math.min(3.0, _ds[9]!=null?_ds[9]:2.0)); const cands={}; // plancher 1,1 km : en ville DENSE la journée se ramasse sur un vrai quartier ; les zones clairsemées gardent une bulle plus large (auto, via la distance au 10e lieu)
  const blockBike=usedKinds&&usedKinds.has('velo');
  const blockFit=usedKinds&&usedKinds.has('fitness'); // 1 salle de fitness max sur le séjour, pas tous les jours
  const add=(c)=>{if(!c||used.has(_norm(c.nom)))return;if(blockBike&&BIKE.test(c.nom))return;if(blockFit&&FIT_RE.test(c.nom))return;var _sk=actKind(c);if(_sk&&usedKinds&&usedKinds.has(_sk))return;/* variété inter-jours : pas 2 fois le même type de sport (golf, tennis…) */if((cands[c.theme]||[]).some(o=>_norm(o.nom)===_norm(c.nom)))return;(cands[c.theme]=cands[c.theme]||[]).push(c);};
  const near=(arr)=>arr.map(c=>Object.assign({},c,{d:hav(center.lat,center.lng,c.lat,c.lng)}));
  // activités des thèmes choisis, À PIED autour de l'ancrage (qualité d'abord)
  themes.forEach(th=>{near(all.filter(c=>c.theme===th&&!used.has(_norm(c.nom)))).filter(c=>c.d<=WALK).sort((a,b)=>b.score-a.score||a.d-b.d).slice(0,8).forEach(add);});
  // repas : gastronomie marchable
  if(!(cands.gastronomie&&cands.gastronomie.length)){near(all.filter(c=>c.theme==='gastronomie'&&!used.has(_norm(c.nom)))).filter(c=>c.d<=WALK).sort((a,b)=>a.d-b.d).slice(0,4).forEach(add);}
  // bien-être composite : emprunter la nature paisible marchable
  if(themes.includes('bienetre')&&!themes.includes('nature')){near(all.filter(c=>c.theme==='nature'&&!used.has(_norm(c.nom)))).filter(c=>c.d<=WALK).sort((a,b)=>b.score-a.score).slice(0,4).forEach(c=>add(Object.assign({},c,{theme:'bienetre',wellness:true})));}
  // MIN 1 par thème : si rien à pied -> UN saut voiture vers le meilleur lieu QUALITATIF (jamais de filler médiocre)
  themes.forEach(th=>{if(cands[th]&&cands[th].length)return;const far=all.filter(c=>c.theme===th&&!used.has(_norm(c.nom))).map(c=>Object.assign({},c,{d:hav(center.lat,center.lng,c.lat,c.lng)})).sort((a,b)=>(b.score-b.d*0.2)-(a.score-a.d*0.2))[0];if(far)add(far);});
  // ===== JOKER VOITURE (auto-régulé) : si la bulle marchable est trop pauvre pour remplir la journée,
  // on complète avec les meilleures activités régionales (≤ CARHOP_KM). En grande ville la bulle est
  // riche (>= DAY_MIN_ACT) -> ce bloc ne se déclenche JAMAIS. Pour une petite ville / une RÉGION (Toscane) -> oui.
  let actCount=themes.reduce((n,th)=>n+((cands[th]||[]).length),0);
  if(actCount<DAY_MIN_ACT){
    const have=new Set();themes.forEach(th=>(cands[th]||[]).forEach(c=>have.add(_norm(c.nom))));
    const extra=all.filter(c=>themes.includes(c.theme)&&!used.has(_norm(c.nom))&&!have.has(_norm(c.nom)))
      .map(c=>Object.assign({},c,{d:hav(center.lat,center.lng,c.lat,c.lng)}))
      .filter(c=>c.d>WALK&&c.d<=CARHOP_KM)
      .sort((a,b)=>(b.score-b.d*0.15)-(a.score-a.d*0.15));
    for(const c of extra){if(actCount>=DAY_MIN_ACT)break;add(Object.assign({},c,{carhop:true}));actCount++;}
  }
  Object.keys(cands).forEach(k=>cands[k]=cands[k].sort((a,b)=>(hav(center.lat,center.lng,a.lat,a.lng)-hav(center.lat,center.lng,b.lat,b.lng))||(b.score-a.score)));
  return cands;
}

function planDay(dayActs,lunch,dinner,evening){
  var ordered=[],t=8*60+30,DAY_END=18*60+30;
  function transit(a,b){var dm=hav(a.lat,a.lng,b.lat,b.lng)*1000;var car=(a.carhop||b.carhop||dm>3000);return car?Math.max(8,Math.round(dm/600)):Math.max(5,Math.round(dm*1.3/75));}

    if(minStart)start=Math.max(start,minStart);
    if(cap&&start>cap)return false; // démarre trop tard -> on n'ajoute PAS (pas de débordement nocturne)
    // HORAIRES : une ACTIVITÉ dont on connaît opening_hours et qui est FERMÉE à ce créneau n'est pas ajoutée -> le mécanisme d'overflow la retente plus tard (glacier 8h30 -> l'après-midi), sinon elle est écartée (marché l'après-midi). Pas d'opening_hours -> toujours OK (dégradation gracieuse). EXEMPTÉS : vrais repas (§4) + sortie du soir garantie.
    var _oh=(s&&(s.opening_hours||(s._c&&s._c.opening_hours)))||null;
    var _isMeal=s&&s.theme==='gastronomie'&&!(s.foodExp||(s._c&&s._c.foodExp));

  var _kept=dayActs.slice(0,8);

  if(evening)add(evening,90,21*60+15,null,true);
  return ordered;
}
// AUTO-TEST du planificateur : scénarios synthétiques -> vérifie les invariants (à lancer via le bouton 🧪)
function selfTestPlanner(){
  function mk(n,th,dlatm){return {nom:n,theme:th,lat:43.21+(dlatm||0)/111000,lng:2.35,carhop:false,_c:{nom:n,theme:th}};}
  function meal(n){return Object.assign(mk(n,'gastronomie'),{_c:{nom:n,theme:'gastronomie'}});}
  var fails=[];
  function check(name,cond){if(!cond)fails.push(name);}
  function run(label,dayActs,lunch,dinner,evening){
    var o=planDay(dayActs,lunch,dinner,evening);
    var nonOpen=o.filter(s=>!s.openEnd);
    check(label+': fin ≤ 22h30 (hors fin libre)',nonOpen.every(s=>s._t1<=22*60+30));
    check(label+': ordre chronologique',o.every((s,k)=>k===0||s._t0>=o[k-1]._t1));
    var dayN=o.filter(s=>s!==lunch&&s!==dinner&&s!==evening).length;
    check(label+': ≤ 8 activités de journée',dayN<=8);
    var noms=o.map(s=>s.nom);check(label+': pas de doublon',new Set(noms).size===noms.length);
    if(evening)check(label+': sortie du soir en fin libre',evening.openEnd===true);
    return o.length;
  }
  var many=[];for(var i=0;i<10;i++)many.push(mk('Parc '+i,'nature',i*120));
  run('10 activités',many.slice(),meal('Déj'),meal('Dîner'),mk('Bar','festif'));
  run('2 activités',[mk('A','culture'),mk('B','sport',200)],meal('Déj'),meal('Dîner'),null);
  run('0 activité',[],meal('Déj'),meal('Dîner'),null);
  run('8 sans repas',(function(){var a=[];for(var j=0;j<8;j++)a.push(mk('X'+j,'sport',j*150));return a;})(),null,null,null);
  log('🧪 Auto-test planificateur : '+(fails.length?('❌ '+fails.length+' échec(s) → '+fails.join(' | ')):'✅ tous les invariants OK'),fails.length>0);
  return fails.length===0;
}

        var _gd=gp.map(c=>hav(center.lat,center.lng,c.lat,c.lng)).sort((a,b)=>a-b);var altR=Math.max(1.2,Math.min(2.5,_gd[5]!=null?_gd[5]:2.5)); // rayon alternatives ADAPTATIF : ~1,2 km en ville dense, jusqu'à 2,5 km en petite ville
        var usedM=new Set(steps.filter(x=>x.theme==='gastronomie').map(x=>_norm(x.nom)));
        steps.forEach(function(s){if(s.theme!=='gastronomie')return;
          var cand=gp.filter(c=>!usedM.has(_norm(c.nom)) && !(c.price&&(c.price<lo||c.price>hi))).map(c=>Object.assign({},c,{d2:hav(s.lat,s.lng,c.lat,c.lng)})).filter(c=>c.d2<=altR); // jamais hors fourchette, et dans le rayon adaptatif (proche en ville dense, plus large en petite ville)
          var tlo=cand.filter(c=>c.price===lo).sort((a,b)=>a.d2-b.d2)[0]; // la moins chère de la fourchette, la + proche
          var thi=cand.filter(c=>c.price===hi).sort((a,b)=>a.d2-b.d2)[0]; // la plus chère de la fourchette
          var alts=[];if(tlo)alts.push(tlo);if(thi)alts.push(thi); // une de chaque gamme = vrai mélange
          if(alts.length<2){var fill=cand.filter(c=>!alts.some(a=>_norm(a.nom)===_norm(c.nom))).sort((a,b)=>a.d2-b.d2);for(var z=0;z<fill.length&&alts.length<2;z++)alts.push(fill[z]);} // compléter si une gamme manque (prix inconnu ou le + proche)
          alts.forEach(a=>usedM.add(_norm(a.nom)));
          s.alts=alts.map(c=>({nom:c.nom,price:c.price||null,adresse:c.address||null}));
        });
      })();
      // LIBELLÉS DE REPAS forcés par l'ORDRE chronologique : 1er repas = Déjeuner, 2e = Dîner (évite « Dîner à 12h40 » ou un déj/dîner inversé)
      var mealN=0;steps.forEach(s=>{if(s.theme!=='gastronomie')return;
        if(s._c&&s._c.foodExp){var _fn=((s.nom||'')+' '+((s._c.cat)||'')+' '+((s._c.category_src||[]).join(' '))).toLowerCase();
          var _fl;
          if(/coffee_and_tea|coffee.?shop|\bcaf[ée]\b|tea.?(house|room)|salon de th[ée]|caf[ée]th/.test(_fn))_fl={t:'Café de spécialité — '+s.nom,x:'Adresse réputée pour le café/thé : torréfaction soignée, ambiance élégante, une parenthèse gourmande dans le quartier.'};
          else if(/ice_cream|glacier|glaces?\b|gelato/.test(_fn))_fl={t:'Glacier — '+s.nom,x:'Glacier réputé : parfums artisanaux à déguster en flânant.'};
          else if(/march[ée]|marketplace|\bmarket\b|night.?market/.test(_fn))_fl={t:'Marché — '+s.nom,x:'Flânerie au marché : étals de producteurs, produits frais et ambiance locale. À parcourir, goûter, rapporter.'};
          else if(/\bhalle|food.?hall|food.?court/.test(_fn))_fl={t:'Halle gourmande — '+s.nom,x:'Halle gourmande : un toit, plein d\'étals et de comptoirs pour picorer et découvrir les spécialités du coin.'};
          else if(/winery|vignoble|\bcave\b|d[ée]gustation|wine/.test(_fn))_fl={t:'Cave & dégustation — '+s.nom,x:'Halte œnologique : sélection de vins du terroir et, souvent, une dégustation à la clé.'};
          else if(/brewery|brasserie artisanale|distiller/.test(_fn))_fl={t:'Brasserie / distillerie — '+s.nom,x:'Visite-dégustation autour de bières ou spiritueux faits maison.'};
          else if(/fromager|cheese/.test(_fn))_fl={t:'Fromagerie — '+s.nom,x:'Fromagerie de quartier : crémier-affineur, sélection locale à humer et déguster.'};
          else if(/chocolat|confiser/.test(_fn))_fl={t:'Chocolaterie — '+s.nom,x:'Maison du chocolat : créations d\'artisan, vitrine gourmande et quelques carrés à emporter.'};
          else if(/p[âa]tisser|bakery|boulanger/.test(_fn))_fl={t:'Pâtisserie / boulangerie — '+s.nom,x:'Adresse sucrée réputée : viennoiseries et pâtisseries à savourer sur le pouce.'};
          else if(/[ée]picerie|gourmet|delicatessen|\bdeli\b/.test(_fn))_fl={t:'Épicerie fine — '+s.nom,x:'Épicerie fine : produits d\'exception et spécialités à dénicher pour la maison ou un cadeau.'};
          else _fl={t:'Étape gourmande — '+s.nom,x:'Lieu gourmand à explorer — produits, ambiance et saveurs locales (à visiter, ce n\'est pas un repas).'};
          s.titre=_fl.t;s.texte=_fl.x;return;} // expérience food typée : la journée se lit comme un vrai parcours gourmand
        mealN++;var pr=s._c&&s._c.price;s.titre=(mealN===1?'Déjeuner':'Dîner')+' — '+s.nom+(pr?' · '+'€'.repeat(Math.min(4,pr)):'');});
      // CAVEAT ACCÈS : salles de fitness -> réserver ; clubs/associations -> accès à la journée à vérifier
      steps.forEach(s=>{if(!(s._c&&s._c.membership)||!s.texte)return;if(/réserv|à vérifier/i.test(s.texte))return;
        if(FIT_RE.test(s.nom||'')||actKind(s._c)==='fitness')s.texte+=' Pensez à appeler pour réserver (accès à la journée à vérifier).';
        else s.texte+=' Accès à la journée à vérifier.';});
      // TEMPS LIBRE : on NOMME les trous > 75 min (slow travel : la journée respire, mais on l'assume au lieu de laisser un vide)
      var withFree=[];
      for(var kk=0;kk<steps.length;kk++){withFree.push(steps[kk]);
        if(kk<steps.length-1){var gap=steps[kk+1]._t0-steps[kk]._t1;
          if(gap>75){var _g=Math.min(gap,90);withFree.push({libre:true,theme:'libre',titre:'Temps libre',texte:'Un moment pour souffler : flâner dans le quartier, une terrasse de café, ou simplement du repos. Rien d\'imposé — c\'est aussi ça, voyager au calme.',heure:fmtH(rc(steps[kk]._t1)),fin:fmtH(rc(steps[kk]._t1+_g)),duree:_g});}}} // TEMPS LIBRE PLAFONNÉ à ~90 min (jamais un trou béant de 5h) : la journée finit plus tôt et assumée, plutôt qu'un vide déguisé
      steps=withFree;
      steps.forEach(s=>{var _k=actKind(s._c||s);if(_k)usedKinds.add(_k);s.adresse=(s._c&&s._c.address)||null;
        if(!s.libre){var _jf=joursFermes(s.opening_hours||(s._c&&s._c.opening_hours)||null); if(_jf && (s.texte||'').indexOf('Fermé le')<0 && (s.texte||'').indexOf('Ouvert seulement')<0) s.texte=(s.texte?s.texte+' ':'')+_jf;} // NOTE HORAIRE (jour de fermeture OU ouverture limitée), si connu -> on prévient sans rejeter (pas de date réelle)
        delete s._c;if(s.nom)used.add(_norm(s.nom||''));}); // variété inter-jours + on garde l'adresse réelle pour l'affichage
      if(steps.some(s=>BIKE.test(s.nom||'')))usedKinds.add('velo');
      if(steps.some(s=>FIT_RE.test(s.nom||'')))usedKinds.add('fitness');
      usedZones.push(center);
      DAYS.push({num:i+1,quartier,center,steps,cands,excursion,distKm:Math.round(anchor.distKm),localLM:_dayLM});
    }
    if(!DAYS.length)throw new Error('aucun lieu trouvé pour ces thèmes');
        log('Terminé ✔');
    document.getElementById('result').style.display='flex';
    initMap();renderTabs();showDay(DAYS[0].num);
  }catch(e){log('Erreur : '+e.message,true);}
  btn.disabled=false;
}

function initMap(){if(MAP)return;MAP=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/light-v11',center:[DAYS[0].center.lng,DAYS[0].center.lat],zoom:13});}
function clearMarkers(){MARKERS.forEach(m=>m.remove());MARKERS=[];}
function renderTabs(){document.getElementById('tabs').innerHTML=DAYS.map(d=>'<div class="tab'+(d.num===ACTIVE?' on':'')+'" onclick="showDay('+d.num+')">Jour '+d.num+' · '+d.quartier+'</div>').join('');}
function legBetween(a,b,bikeActive){
  var d=hav(a.lat,a.lng,b.lat,b.lng)*1000; // m a vol d'oiseau
  if((a&&a.carhop)||(b&&b.carhop)||d>3000){ // saut voiture (activit\u00e9 hors de la bulle marchable) -> on l'EXPLIQUE
    var km=(d/1000).toFixed(1)+' km';var mn=Math.max(5,Math.round(d/600));
    var alt='';
    if(d<=5000){var wmin=Math.max(1,Math.round(d*1.3/75));alt=' \u00b7 ou ~'+wmin+' min \u00E0 pied';} // < 5 km : marche possible en alternative
    return '<div class="leg leg-car">\uD83D\uDE97 Voiture, taxi ou transports \u00b7 '+km+' \u00b7 ~'+mn+' min'+alt+'</div>'; // on n'affirme pas \u00AB voiture n\u00E9cessaire \u00BB : en ville taxi/m\u00E9tro font le job
  }
  var wd=d*1.3;
  var dist=(wd<1000?Math.round(wd/10)*10+' m':(wd/1000).toFixed(1)+' km');
  if(bikeActive){var bm=Math.max(1,Math.round(wd/250));return '<div class="leg">\uD83D\uDEB2 '+dist+' \u00b7 ~'+bm+' min \u00e0 v\u00e9lo</div>';}
  var mins=Math.max(1,Math.round(wd/75));
  return '<div class="leg">\u2193 '+dist+' \u00b7 ~'+mins+' min \u00e0 pied</div>';
}
// SUR LE CHEMIN : repères NOTABLES réellement situés sur le segment A→B (projection entre A et B + < ~180 m du tracé). Aucun texte inventé.
function onTheWay(a,b,pool,exclude){
  if(!pool||!pool.length)return [];
  var R=6371000, rad=Math.PI/180, latm=(a.lat+b.lat)/2*rad;
  function xy(p){return {x:(p.lng-a.lng)*rad*Math.cos(latm)*R, y:(p.lat-a.lat)*rad*R};}
  var B=xy(b), segLen2=B.x*B.x+B.y*B.y;
  if(segLen2<150*150)return []; // trajet < 150 m : rien à signaler
  var res=[];
  pool.forEach(function(L){
    if(exclude&&exclude.has(_norm(L.nom)))return; // jamais une étape déjà au programme
    var P=xy(L), t=(P.x*B.x+P.y*B.y)/segLen2;
    if(t<0.12||t>0.88)return; // doit être ENTRE les deux pins (marge = on exclut les extrémités)
    var perp=Math.hypot(P.x-t*B.x,P.y-t*B.y);
    if(perp>250)return; // < ~250 m du tracé à pied (filet élargi : plus de pépites dans les quartiers riches)
    res.push({nom:L.nom,perp:perp,score:L.score||0});
  });
  res.sort(function(x,y){return (y.score-x.score)||(x.perp-y.perp);});
  var seen={},uniq=[];res.forEach(function(r){var k=_norm(r.nom);if(seen[k])return;seen[k]=1;uniq.push(r);});
  return uniq.slice(0,3);
}
// adresse lisible : on garde les segments en caractères latins (rue, n°) + codes postaux, on retire le pur non-latin (thaï, chinois…)
function romanizeAddr(a){if(!a)return null;var segs=a.split(/\s*,\s*/).map(function(s){return s.trim();}).filter(function(s){return s&&(/[A-Za-zÀ-ÿ]/.test(s)||/^\d{3,6}$/.test(s));});var r=segs.join(', ');return r.length>=4?r:null;}
var TH_BADGE={culture:'🏛️ Culture',sport:'🏃 Sport',nature:'🌳 Nature',gastronomie:'🍽️ Gastronomie',bienetre:'🧘 Bien-être',festif:'🎉 Festif',urbain:'🏙️ Urbain'};
function themeChip(th){return TH_BADGE[th]?'<span style="display:inline-block;margin-left:8px;padding:1px 8px;border-radius:11px;background:#efe7d8;color:#8a6d3b;font-size:11px;font-weight:600;vertical-align:middle;white-space:nowrap">'+TH_BADGE[th]+'</span>':'';}
function showDay(num){ACTIVE=num;const day=DAYS.find(d=>d.num===num);renderTabs();
  clearMarkers();const b=new mapboxgl.LngLatBounds();
  let lhtml='';const bikeActive=day.steps.some(s=>s.nom&&BIKE.test(s.nom));let stepNo=0,lastReal=null;
  const dayNames=new Set(day.steps.filter(s=>!s.libre&&s.nom).map(s=>_norm(s.nom)));
  const shownOTW=new Set(); // curiosités « en chemin » déjà montrées : on ne répète JAMAIS la même sur la journée
  if(day.excursion)lhtml+='<div class="leg leg-car" style="margin:0 0 10px 0;border-left:none;padding-left:0">'+(day.distKm>12?('🚗 Journée-excursion · ~'+day.distKm+' km du centre (voiture recommandée)'):('🚕 Autre quartier · '+day.quartier+' à ~'+day.distKm+' km du centre — taxi, transports ou voiture'))+'</div>'; // métropole : un quartier à 4-5 km n'est pas une « excursion voiture »
  day.steps.forEach((s)=>{
    if(s.libre){ // bloc « Temps libre » : pas de pin, pas de marqueur
      lhtml+='<div class="step" style="background:#f1e9da;border-left-color:#cbb89a"><div class="h">'+(s.heure||'')+(s.fin?' – '+s.fin:'')+(s.duree?' · ≈'+durLabel(s.duree):'')+'</div><div class="t">☕ '+(s.titre||'Temps libre')+'</div><div class="x">'+(s.texte||'')+'</div></div>';
      return;
    }
    if(lastReal){lhtml+=legBetween(lastReal,s,bikeActive);
      // « sur le chemin » : seulement sur un trajet à pied (pas un saut voiture), repères réels entre les deux pins
      var _dm=hav(lastReal.lat,lastReal.lng,s.lat,s.lng)*1000, _isCar=(lastReal.carhop||s.carhop||_dm>3000);
      if(!_isCar){var _exTW=new Set(dayNames);shownOTW.forEach(function(n){_exTW.add(n);}); // exclut les étapes ET les curiosités déjà montrées
        var _ow=onTheWay(lastReal,s,(day.localLM&&day.localLM.length?day.localLM:LANDMARKS),_exTW);
        if(_ow.length){_ow.forEach(function(w){shownOTW.add(_norm(w.nom));});lhtml+='<div class="leg" style="border-left-color:#cbb89a;color:#8a6d3b">👀 En chemin : '+_ow.map(function(w){return w.nom;}).join(' · ')+'</div>';}}
    }
    stepNo++;
    const el=document.createElement('div');el.className='mk';el.textContent=stepNo;
    const mk=new mapboxgl.Marker({element:el}).setLngLat([s.lng,s.lat]).addTo(MAP);MARKERS.push(mk);b.extend([s.lng,s.lat]);
    lhtml+='<div class="step"><div class="h">'+(s.openEnd?((s.heure||'')+' – fin libre (à votre rythme)'):((s.heure||'')+(s.fin?' – '+s.fin:'')+(s.duree?' · ≈'+durLabel(s.duree):'')))+'</div><div class="t">'+stepNo+'. '+(s.titre||'')+themeChip(s.theme)+'</div><div class="x">'+(s.texte||'')+'</div><div class="pin">📍 '+(s.nom||'')+'</div>'+(romanizeAddr(s.adresse)&&!s.libre?'<div style="color:#9a8f7d;font-size:12px;margin:3px 0 0 20px">'+romanizeAddr(s.adresse)+'</div>':'')+((s.alts&&s.alts.length)?'<div style="color:#9a8f7d;font-size:12px;margin:5px 0 0 20px">Autres options : '+s.alts.map(function(a){return (a.price?'€'.repeat(Math.min(4,a.price))+' ':'')+a.nom;}).join('  ·  ')+'</div>':'')+'</div>';
    lastReal=s;
  });
  document.getElementById('list').innerHTML=lhtml;
  try{if(day.steps.length)MAP.fitBounds(b,{padding:60,maxZoom:15,duration:500});}catch(e){}
  // (3) panneau debug retiré en PROD
  const dbg=document.getElementById('debug');if(dbg){dbg.innerHTML='';dbg.style.display='none';}
}
</script>
